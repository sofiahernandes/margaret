description = "Figma bridge both ways: generate design|diagram, or pull code|context|connect|motion (default design)"
prompt = "Bridge to Figma using mode {{args}}. Default mode 'design': generate a new design (screen or component) in Figma from the given prompt or spec. Mode 'diagram': generate a diagram (flowchart, architecture, sequence) in Figma or FigJam. Mode 'code': convert the given Figma frame/component selection into working code matching this project's stack and conventions. Mode 'context': pull and summarize the design context (structure, tokens, spacing, components) from the given Figma file/selection without generating code. Mode 'connect': wire existing code components to their Figma counterparts via Code Connect so the design panel resolves to the real implementation. Mode 'motion': read the Figma motion/animation spec on the selection and implement matching transitions/animations in code. Ask for missing details (target file, spec) before generating; ask for the Figma file or selection link if none was given for a pull mode."
