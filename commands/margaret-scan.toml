description = "Scan for over-engineering: diff by default, pass repo for whole codebase"
prompt = "Scan {{args}} for over-engineering only, not correctness. If args contains 'repo', scan the entire codebase and rank findings biggest cut first; otherwise scan only the current diff. One line per finding: L<line>: <tag> <what to cut>. <replacement>. Tags: delete (dead code/speculative feature), stdlib (reinvented standard library), native (dependency doing what the platform does), yagni (abstraction with one implementation), shrink (same logic, fewer lines). End with net lines (and deps removable, if repo-scoped). If nothing to cut: 'Lean already. Ship.' Lists findings only, applies nothing."
